homelab:
  - tag: "Enterprise & ERP"
    meta: "Axians Infoma"
    title: "Kaufmännische Fachverfahren mit C# / .NET und AL"
    dek: "Objektorientierte .NET-Services und Microsoft Dynamics 365 Business Central (AL) greifen für kommunale und kaufmännische Kernprozesse strukturiert ineinander."
  - tag: "Static Site & Container"
    meta: "Hugo · Docker · Portainer"
    title: "Statischer Hugo-Build im mehrstufigen Docker-Image"
    dek: "Generiert mit GoHugo aus modularen Templates, mit lokal gehosteten WOFF2-Schriften und ausgeliefert über Nginx-Alpine im eigenen Proxmox-Homelab."
  - tag: "Industrial IoT"
    meta: "Angular & IO-Link"
    title: "Web-Oberflächen für industrielle Sensorik"
    dek: "Erfahrung an der Schnittstelle zwischen modernen TypeScript/Angular-Frontends und hardwarenaher Gerätekommunikation über das IO-Link-Protokoll."
