      {{- $p := index .Site.Data (printf "profile_%s" .Site.Language.Lang) -}}
      <section class="highlights-strip" aria-label="{{ $p.ui.highlights_aria }}">
        <div class="highlights-grid">
          {{- range $p.highlights }}
          <article class="highlight-card highlight-card--{{ .color }}">
            <div class="highlight-top">
              <span class="highlight-idx-wrap">
                <span class="highlight-geom geom--{{ .color }}" aria-hidden="true"></span>
                <span class="highlight-idx">{{ .idx }}</span>
              </span>
              <span class="highlight-period">{{ .period }}</span>
            </div>
            <div class="highlight-body">
              <h2 class="highlight-title">{{ .title }}</h2>
              <p class="highlight-desc">{{ .desc | safeHTML }}</p>
            </div>
          </article>
          {{- end }}
        </div>
      </section>
