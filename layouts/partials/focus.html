      {{- $p := index .Site.Data (printf "profile_%s" .Site.Language.Lang) -}}
      {{- $ui := $p.ui -}}
      <section class="love" id="schwerpunkte">
        <div class="love-head">
          <div class="love-title">
            <p class="eyebrow">{{ $ui.focus_eyebrow }}</p>
            <h2>{{ $ui.focus_heading_1 }}<br />{{ $ui.focus_heading_2 }}</h2>
          </div>
          <a href="#kontakt" class="pill pill--ink">{{ $ui.focus_cta }}</a>
        </div>

        <div class="focus-grid">
          {{- range $p.focus_cards }}
          <article class="focus-card focus-card--{{ .color }}">
            <div class="focus-card-top">
              <span class="focus-tag">{{ .tag }}</span>
              <span class="focus-org">{{ .org }}</span>
            </div>
            <h3 class="focus-title">{{ .title }}</h3>
            <p class="focus-body">{{ .body }}</p>
          </article>
          {{- end }}
        </div>
      </section>
