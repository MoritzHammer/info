      <section class="journal panel" id="architektur">
        <div class="journal-head">
          <h2 class="panel-title">Technik im Detail</h2>
          <a href="{{ .Site.Params.github }}" target="_blank" rel="noopener" class="pill pill--ink">Auf GitHub folgen ↗</a>
        </div>

        <div class="posts">
          {{- range .Site.Data.profile.homelab }}
          <article class="post-card">
            <div class="meta">
              <span class="chip chip--sm chip--outline">{{ .tag }}</span>
              <span>{{ .meta }}</span>
            </div>
            <h3 class="title">{{ .title }}</h3>
            <p class="dek">{{ .dek }}</p>
          </article>
          {{- end }}
        </div>
      </section>
